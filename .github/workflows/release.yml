name: Release (Android / EXE / CLI)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APKs
        working-directory: apps/android
        run: gradle assembleDebug assembleRelease --no-daemon
      - name: Collect artifacts
        run: |
          mkdir -p staging
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk staging/LexField-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk staging/LexField-release-unsigned.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: staging/*

  desktop:
    name: Windows EXE (Tauri NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter @lexfield/desktop build
      - name: Build Tauri bundle (NSIS)
        run: pnpm --filter @lexfield/desktop exec tauri build
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe staging/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: staging/*

  cli:
    name: Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cli
      - name: Build CLI
        working-directory: apps/cli
        run: cargo build --release
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item apps/cli/target/release/lexfield.exe staging/
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: staging/*

  release:
    name: Publish GitHub Release
    needs: [android, desktop, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" staging/* \
            --title "LexField ${{ inputs.tag }}" \
            --generate-notes
