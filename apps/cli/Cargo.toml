[package]
name = "lexfield"
version = "0.1.0"
description = "LexField CLI - CET-4/6 complete vocabulary trainer with FSRS-6"
edition = "2021"

[[bin]]
name = "lexfield"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fsrs = "6"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
crossterm = "0.28"
dirs = "5"

[profile.release]
lto = true
strip = true
